<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test de Seguretat Informàtica</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;padding:20px;color:#222}
.container{max-width:900px;margin:auto;background:white;padding:30px;border-radius:14px;box-shadow:0 4px 18px #0002}
h1{text-align:center;color:#17365d}.intro{text-align:center;color:#555}
.question{margin:24px 0;padding:18px;border:1px solid #ddd;border-radius:10px}
.question h3{margin-top:0}.option{display:block;padding:9px;border-radius:7px;margin:5px 0}
.option:hover{background:#f0f4f8}.correct{background:#d9f7df!important;border:1px solid #43a047}
.incorrect{background:#ffdede!important;border:1px solid #e53935}
.right-answer{font-weight:bold;color:#1b7f2a;margin-top:8px}
button{display:block;margin:25px auto;padding:13px 25px;font-size:16px;border:0;border-radius:8px;background:#17365d;color:white;cursor:pointer}
button:hover{background:#24558d}
#result{text-align:center;font-size:22px;font-weight:bold;margin:25px 0;padding:20px;border-radius:10px;background:#eef4fb}
.hidden{display:none}
</style>
</head>
<body>
<div class="container">
<h1>Test de Seguretat Informàtica</h1>
<p class="intro">20 preguntes · Una resposta correcta per pregunta · Nota sobre 10</p>
<form id="quiz"></form>
<button type="button" onclick="corregir()">Corregir test i veure la nota</button>
<div id="result" class="hidden"></div>
<button type="button" onclick="location.reload()">Tornar a fer el test</button>
</div>

<script>
const questions = [
["Per què cal protegir la informació en un sistema informàtic?",["Només per complir amb la normativa legal vigent","Perquè és un actiu valuós que pot patir pèrdues, robatori o modificació no autoritzada","Únicament per evitar que els usuaris facen servir programari no autoritzat","Perquè els sistemes informàtics sempre són insegurs per naturalesa"],"b"],
["Quins són els tres pilars clàssics de la seguretat de la informació?",["Autenticació, autorització i auditoria","Confidencialitat, integritat i disponibilitat","Prevenció, detecció i correcció","Física, lògica i activa"],"b"],
["La confidencialitat garanteix que:",["La informació estiga sempre disponible quan es necessite","La informació no siga modificada per persones no autoritzades","Només les persones autoritzades puguen accedir a la informació","Es puga demostrar qui ha enviat un missatge"],"c"],
["La integritat de la informació es refereix a:",["Que la informació siga exacta, completa i no haja estat alterada de manera no autoritzada","Que la informació estiga xifrada en tot moment","Que la informació estiga disponible 24/7","Que la informació només siga accessible des de la xarxa interna"],"a"],
["La disponibilitat implica que:",["La informació només estiga accessible en horari laboral","Els usuaris autoritzats puguen accedir a la informació i als recursos quan els calga","La informació estiga duplicada en tres servidors","La informació no es puga esborrar mai"],"b"],
["El principi de no repudi (no repudiació) significa que:",["L'usuari no pot negar haver realitzat una acció o enviat un missatge","L'usuari pot rebutjar les condicions d'ús del sistema","El sistema no pot rebutjar cap petició d'accés","Cap usuari pot ser expulsat del sistema"],"a"],
["Quina diferència hi ha entre seguretat física i seguretat lògica?",["La física protegeix el maquinari i les instal·lacions; la lògica protegeix les dades i el programari","La física protegeix les dades; la lògica protegeix els equips","Són sinònims i s'utilitzen indistintament","La física només s'aplica a servidors i la lògica a ordinadors personals"],"a"],
["La seguretat passiva es caracteritza per:",["Actuar abans de produir-se l'incident, prevenint-lo","Detectar i corregir els danys un cop produïda l'amenaça","Xifrar totes les comunicacions de la xarxa","Analitzar les vulnerabilitats del sistema periòdicament"],"b"],
["La seguretat activa es caracteritza per:",["Tenir com a objectiu evitar o prevenir les amenaces abans que es materialitzen","Actuar només després que s'haja produït un atac","Ser sempre més econòmica que la seguretat passiva","No requerir cap mena de manteniment"],"a"],
["Quins són els tres factors d'autenticació clàssics?",["Usuari, contrasenya i correu electrònic","Una cosa que saps, una cosa que tens i una cosa que tu eres","Xifrat, signatura i hash","Confidencialitat, integritat i disponibilitat"],"b"],
["Un exemple de factor d'autenticació biomètric seria:",["Una contrasenya","Un token USB","L'empremta dactilar o el reconeixement facial","Un certificat digital emmagatzemat al disc"],"c"],
["Què significa el model AAA en seguretat informàtica?",["Accés, Alerta i Auditoria","Autenticació, Autorització i Auditoria (Accounting)","Antivirus, Antispam i Antimalware","Anàlisi, Avaluació i Acció"],"b"],
["La comunicació 'extrem a extrem' (i2i / end-to-end) implica que:",["Les dades viatgen xifrades entre els dos extrems i només ells les poden desxifrar","Les dades passen sense xifrar per tots els intermediaris","El servidor central desxifra sempre els missatges","Només s'aplica a xarxes locals"],"a"],
["Què és una vulnerabilitat?",["Un programa maliciós que ataca el sistema","Una debilitat o error en el sistema que pot ser explotat per una amenaça","Un atac que ja s'ha produït","Una eina per protegir el sistema"],"b"],
["Què és un exploit?",["Un tipus de contrasenya molt segura","Una tècnica, codi o eina que aprofita una vulnerabilitat per comprometre el sistema","Un mètode de xifrat de dades","Un protocol de comunicació segura"],"b"],
["Quin d'aquests és un tipus de malware?",["Tallafocs (firewall)","Xifrat AES","Troià (trojan)","VPN"],"c"],
["Un atac de 'phishing' consisteix principalment a:",["Enviar moltes peticions per saturar un servidor","Enganyar l'usuari perquè revele informació confidencial fent-se passar per una entitat de confiança","Xifrar les dades de la víctima i demanar un rescat","Escanejar ports oberts d'una xarxa"],"b"],
["Quin és l'objectiu principal del Reglament General de Protecció de Dades (RGPD)?",["Regular l'ús de programari lliure a les empreses","Protegir les persones físiques pel que fa al tractament de les seves dades personals","Establir les normes tècniques dels sistemes operatius","Regular únicament les transaccions comercials electròniques"],"b"],
["En el context de l'Administració electrònica, què cal garantir principalment?",["Que tots els tràmits es facen presencialment","La identitat dels ciutadans i la integritat i confidencialitat de les seues dades en els tràmits telemàtics","Que els tràmits només es puguen fer amb contrasenya simple","Que no es guarde cap registre dels tràmits realitzats"],"b"],
["Quina afirmació sobre els tipus d'atacs és correcta?",["Els atacs passius només modifiquen la informació sense llegir-la","Els atacs actius busquen modificar, interrompre o destruir recursos, mentre que els passius solen interceptar o escoltar informació sense alterar-la","Tots els atacs són sempre actius","Els atacs passius sempre deixen traces evidents al sistema"],"b"]
];

const letters=["a","b","c","d"];
const quiz=document.getElementById("quiz");
questions.forEach((q,i)=>{
 let div=document.createElement("div"); div.className="question"; div.id="q"+i;
 div.innerHTML=`<h3>${i+1}. ${q[0]}</h3>`;
 q[1].forEach((opt,j)=>{
   div.innerHTML+=`<label class="option" id="q${i}${letters[j]}"><input type="radio" name="q${i}" value="${letters[j]}"> <b>${letters[j]})</b> ${opt}</label>`;
 });
 quiz.appendChild(div);
});

function corregir(){
 let score=0;
 questions.forEach((q,i)=>{
   letters.forEach(l=>document.getElementById("q"+i+l).classList.remove("correct","incorrect"));
   const selected=document.querySelector(`input[name="q${i}"]:checked`);
   const correct=q[2];
   document.getElementById("q"+i+correct).classList.add("correct");
   if(selected){
     if(selected.value===correct) score++;
     else document.getElementById("q"+i+selected.value).classList.add("incorrect");
   }
 });
 const nota=(score/20*10).toFixed(2);
 const result=document.getElementById("result");
 result.classList.remove("hidden");
 result.innerHTML=`Resultat: <strong>${score}/20</strong> encerts — Nota: <strong>${nota}/10</strong><br><small>Les respostes correctes estan marcades en verd i les incorrectes en roig.</small>`;
 window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
}
</script>
</body>
</html>
